<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --paper: #f7f4ee;
  --paper-2: #eee9df;
  --card: #fffdf9;
  --ink: #1b1a17;
  --ink-2: #3b3934;
  --muted: #7a746b;
  --rule: #ddd6c9;
  --accent: #b8401a;
  --accent-soft: #f4e2d7;
  --ok: #2f6b3a;
  --ok-soft: #e0ecdf;
  --bad: #a3261b;
  --bad-soft: #f6dedb;
  --serif: "Iowan Old Style", "Charter", "Source Serif 4", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

/* 1600x900 canvas, scaled to fit the screen by the engine */
.deck {
  position: absolute; left: 50%; top: 50%;
  width: 1600px; height: 900px;
  transform: translate(-50%, -50%) scale(var(--scale, 1));
}
.slide {
  position: absolute; inset: 0;
  padding: 88px 120px 96px;
  display: flex; flex-direction: column;
  opacity: 0; visibility: hidden;
  transition: opacity .35s ease, visibility 0s linear .35s;
}
.slide.active { opacity: 1; visibility: visible; transition: opacity .35s ease; }
.slide.center { justify-content: center; }
.notes { display: none; }

/* Type */
.kicker {
  font: 500 19px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 28px;
}
h1, h2 { font-family: var(--serif); font-weight: 400; letter-spacing: -.02em; margin: 0; }
h1 { font-size: 108px; line-height: 1.02; }
h2 { font-size: 64px; line-height: 1.08; margin-bottom: 36px; max-width: 1300px; }
h3 { font: 600 26px/1.25 var(--sans); margin: 0 0 10px; }
h1 em, h2 em { font-style: italic; color: var(--accent); }
p, li { font-size: 26px; line-height: 1.45; margin: 0; }
.lede { font-family: var(--serif); font-size: 34px; line-height: 1.35; color: var(--ink-2); max-width: 1150px; }
.small, .small p, .small li { font-size: 21px; }
.muted { color: var(--muted); }
.accent { color: var(--accent); }
ul.clean { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
code {
  font-family: var(--mono); font-size: .82em;
  background: var(--paper-2); padding: 2px 8px; border-radius: 6px;
}
pre {
  margin: 0; font: 21px/1.5 var(--mono); color: var(--ink);
  background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
  padding: 26px 30px; overflow: hidden; white-space: pre;
}
pre code { background: none; padding: 0; font-size: inherit; }
/* Hand-applied syntax colors */
.tok-k { color: #8a3ab9; }
.tok-s { color: #2f6b3a; }
.tok-c { color: var(--muted); font-style: italic; }
.tok-f { color: #1d5fa8; }
.tok-bad { background: var(--bad-soft); color: var(--bad); border-radius: 4px; }
.tok-ok { background: var(--ok-soft); color: var(--ok); border-radius: 4px; }

/* Layout */
.grid-2, .grid-3, .grid-4 { display: grid; gap: 28px; }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 20px; }
.grow { flex: 1; min-height: 0; }
.mt-auto { margin-top: auto; }

/* Components */
.card {
  background: var(--card); border: 1px solid var(--rule); border-radius: 18px;
  padding: 30px 32px;
}
.card p, .card li { font-size: 22px; color: var(--ink-2); }
.card .num { font: 500 18px/1 var(--mono); color: var(--accent); margin-bottom: 18px; display: block; }
.chip {
  display: inline-block; font: 18px/1 var(--mono); padding: 9px 14px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--card); color: var(--ink-2);
}
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.hot { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.callout {
  border-left: 4px solid var(--accent); padding: 4px 0 4px 28px;
  font: italic 32px/1.35 var(--serif); color: var(--ink-2); max-width: 1200px;
}
.big-number { font: 400 150px/1 var(--serif); letter-spacing: -.03em; }
.btn {
  font: 500 20px/1 var(--sans); color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 999px; padding: 13px 22px; cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { border-color: var(--ink); }
.btn.is-active, .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.is-active code, .btn[aria-pressed="true"] code, [aria-selected="true"] code { background: rgba(255,255,255,.16); color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* Tabs / segmented toggle — wired by the engine via data-tabs / data-tab / data-panel */
.tab-list {
  display: inline-flex; gap: 4px; padding: 6px; border-radius: 999px;
  background: var(--paper-2); border: 1px solid var(--rule); align-self: flex-start;
}
.tab-list [data-tab] {
  font: 500 20px/1 var(--sans); color: var(--ink-2); background: transparent;
  border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer;
}
.tab-list [data-tab][aria-selected="true"] { background: var(--ink); color: var(--paper); }
.tab-panel { margin-top: 28px; }
[hidden] { display: none !important; }

/* Step reveal — Right arrow reveals .step elements one by one before moving on */
.step { opacity: 0; transform: translateY(14px); transition: opacity .4s ease, transform .4s ease; }
.step.shown { opacity: 1; transform: none; }

/* Chrome */
.deck-footer {
  position: absolute; left: 120px; right: 120px; bottom: 36px;
  display: flex; justify-content: space-between;
  font: 16px/1 var(--mono); color: var(--muted); pointer-events: none;
}
.progress { position: fixed; left: 0; right: 0; bottom: 0; height: 4px; background: var(--paper-2); z-index: 5; }
.progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .35s ease; }
.notes-panel {
  position: fixed; left: 24px; right: 24px; bottom: 20px; max-height: 42vh; overflow: auto; z-index: 10;
  background: var(--ink); color: var(--paper); border-radius: 16px; padding: 22px 28px;
  font: 18px/1.5 var(--sans); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
.notes-panel h4 { margin: 0 0 10px; font: 500 14px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: #e9a98c; }
.notes-panel p, .notes-panel li { font-size: 18px; }
</style>
</head>
<body>
<main class="deck">
